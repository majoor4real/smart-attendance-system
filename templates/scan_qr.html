<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-success">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand mb-0 h1">Scan Attendance QR</span>
            <a href="/student" class="btn btn-light btn-sm">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow p-4">
                    <h3 class="mb-4">Mark Attendance</h3>

                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        {% for message in messages %}
                          <div class="alert alert-info">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <div class="mb-4">
                        <p><strong>Student Name:</strong> {{ student.full_name }}</p>
                        <p><strong>Matric Number:</strong> {{ student.matric_no }}</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">QR Data</label>
                            <textarea name="qr_data" class="form-control" rows="4" placeholder="Paste QR code data here..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Mark Attendance</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
