{% extends "base_dashboard.html" %}

{% block title %}Start Attendance{% endblock %}
{% block page_title %}Start Attendance{% endblock %}

{% block sidebar %}
<a href="{{ url_for('lecturer.lecturer_dashboard') }}">
    <i class="fas fa-house"></i> Dashboard
</a>

<a href="{{ url_for('lecturer.start_attendance') }}" class="active-link">
    <i class="fas fa-qrcode"></i> Start Attendance
</a>

<a href="{{ url_for('lecturer.lecturer_records') }}">
    <i class="fas fa-clipboard-list"></i> Attendance Records
</a>

<a href="{{ url_for('auth.logout') }}">
    <i class="fas fa-right-from-bracket"></i> Logout
</a>
{% endblock %}

{% block content %}
<div class="dashboard-card">
    <h4 class="fw-bold mb-3">Start New Attendance Session</h4>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Select Course</label>
            <select name="course" class="form-select" required>
                <option value="">Select Course</option>
                {% for course in courses %}
                    <option value="{{ course.id }}">{{ course.code }} - {{ course.title }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Generate Attendance QR
        </button>
    </form>
</div>
{% endblock %}
